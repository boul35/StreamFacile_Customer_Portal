services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamfacile
      POSTGRES_PASSWORD: streamfacile
      POSTGRES_DB: streamfacile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamfacile"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://streamfacile:streamfacile@db:5432/streamfacile
      SESSION_SECRET: changez-moi-en-production
      DISPATCHARR_SIMULATION: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
